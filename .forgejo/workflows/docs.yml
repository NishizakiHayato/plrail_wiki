# Forgejo Actions 工作流
#
# 注意：
#   - 工作流目录是 .forgejo/workflows/（不是 .github/workflows/）
#   - action 使用「完全限定 URL + commit SHA」：
#     * 完全限定 URL 可避免受实例管理员修改 DEFAULT_ACTIONS_URL 影响
#     * commit SHA 可避免 tag 被篡改（官方安全建议）
#   - 下方 SHA 为示例占位，首次接入时请替换为实际 release 对应的 commit SHA
name: docs-pipeline

on:
  # 只在「合并进 main」之后运行：PR 合并本身就会在 main 上产生一次 push 事件。
  # 不再监听 pull_request —— 既避免外部 PR 的内容直接在本机 Runner 上执行，
  # 也避免 PR 阶段占用 Runner 与构建资源。
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'i18n/**'
      - 'docusaurus.config.js'
      - 'sidebars/**'
      - 'scripts/**'
      - 'src/**' # 主题 / 搜索框等前端代码也要触发重新构建
      - 'package.json'
      - '.forgejo/workflows/docs.yml'
  workflow_dispatch:

# 同一分支的新推送自动取消旧运行
concurrency:
  group: docs-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 门禁：多实例 × 多版本 × 多语言 的译文完整性
  # ------------------------------------------------------------------
  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6 # TODO: pin commit SHA
        with:
          persist-credentials: false

      - name: Setup Node
        uses: https://data.forgejo.org/actions/setup-node@v4 # TODO: pin commit SHA
        with:
          node-version: '20'

      - name: Check translations for all instances
        # 英文当前仅占位 / 预留，无法保证每篇都有译文，
        # 因此默认只列出缺失清单、不阻塞流水线。
        # 英文转正后加上下面两段即可恢复门禁：
        # env:
        #   STRICT_I18N: "1"
        run: bash scripts/check-i18n.sh

  # ------------------------------------------------------------------
  # 构建：安装依赖 → docusaurus build → 上传产物
  # ------------------------------------------------------------------
  build:
    needs: [i18n-check]
    runs-on: ubuntu-latest
    steps:
      # 下一步的匿名 git lfs 需要 git-lfs 可执行文件，镜像没带时先装上
      - name: Install git-lfs
        run: |
          command -v git-lfs >/dev/null 2>&1 && exit 0
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq git-lfs

      # 刻意不用 actions/checkout 的 lfs 开关：
      # 它会把 Actions 任务令牌写成 http.<host>.extraheader，
      # 该凭据会被实例的 LFS 端点以 401 拒绝（forgejo#2809），
      # 而 git-lfs 收到 401 后不会退回匿名访问，直接判定失败。
      # 仓库是公开的，改为下面两步匿名拉取。
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6 # TODO: pin commit SHA
        with:
          persist-credentials: false
          lfs: false

      - name: Fetch LFS objects (anonymous)
        run: |
          # 清掉 checkout 注入的临时凭据文件，否则 git-lfs 仍会带上被拒的认证头
          rm -f /tmp/git-credentials-*.config
          rm -f $RUNNER_TEMP/git-credentials-*.config
          git lfs install --local
          git lfs pull

      # 必须：漏拉 LFS 时产物里的图片是坏的空壳，而流水线照样是绿的，
      # 属于不冒烟就发现不了的故障。这里显式失败。
      # 本段刻意不含任何双引号（粘贴时容易被吞）；exit 1 落在步骤主 shell 上，
      # 管道子 shell 里的 exit 不会让步骤失败。
      - name: Verify LFS objects are materialized
        run: |
          git lfs ls-files -l
          if git lfs ls-files -l | awk '{print $2}' | grep -q '^-$'; then
            echo 存在未实体化的 LFS 指针
            exit 1
          fi
          echo 所有 LFS 文件均已实体化

      - name: Setup Node
        uses: https://data.forgejo.org/actions/setup-node@v4 # TODO: pin commit SHA
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site (all locales, single-domain)
        run: npm run build
        env:
          # 未配置时自动回退到本地离线索引（构建期生成 lunr 索引），不影响现有部署。
          # 注意：这个值会写进前端产物，只能填域名（如 https://wiki.plrail.com/api/search），
          # 绝不能填 IP 或内网地址。
          MEILI_ENDPOINT: ${{ vars.MEILI_ENDPOINT }}
        # 若改为「多域名」策略，可用矩阵按语言分别构建（单语言产物不带 /<locale>/ 前缀）：
        #
        # strategy:
        #   fail-fast: false
        #   matrix:
        #     locale: [zh-Hans, en]
        # steps:
        #   - run: npx docusaurus build --locale ${{ matrix.locale }}

      - name: Upload build artifact
        uses: https://data.forgejo.org/forgejo/upload-artifact@v5 # cb8afe72b42edc798abfb8fcb556cf660d894245
        with:
          name: docs-build
          path: build
          retention-days: 7

  # ------------------------------------------------------------------
  # 部署：FTP / FTPS 上传构建产物
  #
  # 需要配置（Settings → Actions → Secrets and variables）：
  #   secrets.FTP_USER     FTP 用户名
  #   secrets.FTP_PASSWORD FTP 密码
  #   secrets.FTP_HOST     FTP 主机
  #   vars.FTP_PORT        （可选）端口，默认 21
  #   vars.FTP_REMOTE      （可选）远端目录，默认站点根目录 /
  #   vars.FTP_TLS         （可选）0 = 明文 FTP；默认 1（显式 FTPS）
  #
  # 防泄露约定：
  #   1) FTP_HOST 走 secrets（主机名可能含 IP），不得写成 vars 或硬编码
  #   2) 本 job 内禁止 echo $FTP_HOST、禁止 set -x、禁止整体打印 env
  #   3) FTP_HIDE_HOST=1 已开启，deploy-ftp.py 不会把目标主机写进日志
  #   4) FTP_TLS 保持默认 1（显式 FTPS），避免凭据明文传输
  #
  # 同步策略为镜像：本地没有的远端文件会被删除，
  # .well-known/ 与 .htaccess 默认保留（证书校验 / 服务器配置用）。
  # ------------------------------------------------------------------
  deploy:
    needs: [build]
    if: forgejo.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # 部署脚本 scripts/deploy-ftp.py 在仓库里，需要先检出
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6 # TODO: pin commit SHA
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: https://data.forgejo.org/forgejo/download-artifact@v7 # 769f970437aa3291b13f35dc23fc87967d7fb19f
        with:
          name: docs-build
          path: build

      - name: Upload to FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE: ${{ vars.FTP_REMOTE }}
          FTP_TLS: ${{ vars.FTP_TLS }}
          # 日志里隐藏 FTP 主机（避免主机名 / IP 出现在公开的运行日志中）
          FTP_HIDE_HOST: '1'
          FTP_FORCE: '1'
        run: python3 scripts/deploy-ftp.py --local build

  # ------------------------------------------------------------------
  # 搜索索引：站点上线后再刷新，避免索引领先于页面内容
  #
  # 需要配置（Settings → Actions → Secrets and variables）：
  #   vars.MEILI_ENABLED       '1' 才运行本 job（开关，非敏感）
  #   secrets.MEILI_HOST       Meilisearch 地址（含端口，可能含内网 IP，按机密处理）
  #   secrets.MEILI_ADMIN_KEY  灌索引用的 admin / master key
  #   vars.MEILI_INDEX         可选，索引名，默认 wiki_docs
  #
  # 防泄露约定：
  #   1) 地址与密钥一律走 secrets，不得写成 vars、不得硬编码进仓库
  #   2) 本 job 内禁止 echo $MEILI_HOST、禁止 set -x、禁止整体打印 env
  #   3) scripts/search/meili-index.mjs 不回显地址，错误信息也做了打码
  # ------------------------------------------------------------------
  index-search:
    needs: [deploy]
    # secrets 不能出现在 if 表达式里，故用非敏感的 MEILI_ENABLED 作为开关
    if: forgejo.ref == 'refs/heads/main' && vars.MEILI_ENABLED == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6 # TODO: pin commit SHA
        with:
          persist-credentials: false
          lfs: false

      - name: Setup Node
        uses: https://data.forgejo.org/actions/setup-node@v4 # TODO: pin commit SHA
        with:
          node-version: '20'

      # 索引脚本零依赖（只用 Node 内置 fetch），无需 npm ci
      - name: Rebuild search index
        run: node scripts/search/meili-index.mjs
        env:
          MEILI_HOST: ${{ secrets.MEILI_HOST }}
          MEILI_ADMIN_KEY: ${{ secrets.MEILI_ADMIN_KEY }}
          MEILI_INDEX: ${{ vars.MEILI_INDEX }}