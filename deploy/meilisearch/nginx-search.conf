# 把 Meilisearch 挂到同一域名下：https://wiki.plrail.com/api/search
#
# 前提：你能改 wiki.plrail.com 那台 Web 服务器的 Nginx 配置。
# 挂在站点域名下必然要带路径 —— 根路径 / 已经是站点首页了。
#
# 前端构建：MEILI_ENDPOINT=https://wiki.plrail.com/api/search npm run build
# 特点：只暴露一个搜索端点，Search Key 由 Nginx 注入，浏览器里看不到任何密钥。
#
# 注意：/search 是站点的搜索结果页，别把 API 也挂到 /search，会冲突。

# —— 放在 http {} 里（限流） ——
# limit_req_zone $binary_remote_addr zone=meili_search:10m rate=5r/s;

# —— 放在站点 server {} 里，且要排在 location / 之前 ——

location = /api/search {
    limit_except POST { deny all; }          # 只读，禁止写入/删除
    limit_req zone=meili_search burst=20 nodelay;

    # 固定转发到指定索引的搜索端点（索引名不暴露给前端）
    proxy_pass http://127.0.0.1:7700/indexes/wiki_docs/search;
    proxy_set_header Host $host;
    proxy_set_header Content-Type "application/json";
    # 这里填 Meilisearch 的 Default Search API Key（只读），不要填 master key
    proxy_set_header Authorization "Bearer 替换为_Search_Key";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # 同源请求可省略；跨域或需要调试时打开
    # add_header Access-Control-Allow-Origin "https://wiki.plrail.com" always;
}

# 可选：健康检查（不要暴露 /keys、/tasks、/dumps、/snapshots）
location = /api/search/health {
    proxy_pass http://127.0.0.1:7700/health;
}

# ==================================================================
# 备选：如果坚持让浏览器直连 Meilisearch（MEILI_HOST 模式）
# 需要子路径反代，并屏蔽所有管理端点：
#
# location /meili/ {
#     proxy_pass http://127.0.0.1:7700/;   # 末尾的 / 会剥掉 /meili 前缀
#     proxy_set_header Host $host;
# }
# location ~ ^/meili/(keys|tasks|dumps|snapshots|logs) { deny all; }
# 构建：MEILI_HOST=https://wiki.plrail.com/meili MEILI_SEARCH_KEY=xxx npm run build
# ==================================================================
